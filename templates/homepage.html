<!DOCTYPE html>
<!--
==========================================================
File: homepage.html
Project: TimberOps

Purpose:
Displays the main TimberOps dashboard after a successful
administrator login.
==========================================================
-->

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimberOps | Dashboard</title>

    <!-- Homepage stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='homepage.css') }}"
    >

    <!-- Font Awesome icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body>

    <!-- ==================================================
         SIDEBAR NAVIGATION
    =================================================== -->

    <aside class="sidebar">

        <!-- Company logo -->
        <div class="logo-box">

            <img
                src="{{ url_for('static', filename='images/transparent-logo.png') }}"
                alt="TimberOps Logo"
                class="sidebar-logo"
            >

        </div>

        <!-- Scrollable navigation menu -->
        <nav class="sidebar-menu" aria-label="Dashboard navigation">

            <!-- Homepage -->
            <a
                href="{{ url_for('home') }}"
                class="sidebar-link active"
                aria-label="Home"
                title="Home"
            >
                <i class="fa-solid fa-house"></i>
            </a>

            <!-- Stock Tracker -->
            <a
                href="{{ url_for('stock_tracker') }}"
                class="sidebar-link"
                aria-label="Stock Tracker"
                title="Stock Tracker"
            >
                <i class="fa-solid fa-box"></i>
            </a>

            <!-- Calendar -->
            <a
                href="#"
                class="sidebar-link"
                aria-label="Calendar"
                title="Calendar"
            >
                <i class="fa-solid fa-calendar-days"></i>
            </a>

            <!-- Messages -->
            <a
                href="#"
                class="sidebar-link"
                aria-label="Messages"
                title="Messages"
            >
                <i class="fa-solid fa-comment"></i>
            </a>

            <!-- Documents -->
            <a
                href="#"
                class="sidebar-link"
                aria-label="Documents"
                title="Documents"
            >
                <i class="fa-solid fa-file-lines"></i>
            </a>

            <!-- Information -->
            <a
                href="#"
                class="sidebar-link"
                aria-label="Information"
                title="Information"
            >
                <i class="fa-solid fa-circle-info"></i>
            </a>

            <!-- Favourites -->
            <a
                href="#"
                class="sidebar-link"
                aria-label="Favourites"
                title="Favourites"
            >
                <i class="fa-solid fa-star"></i>
            </a>

            <!-- Reports -->
            <a
                href="#"
                class="sidebar-link"
                aria-label="Reports"
                title="Reports"
            >
                <i class="fa-solid fa-chart-column"></i>
            </a>

            <!-- Settings -->
            <a
                href="#"
                class="sidebar-link"
                aria-label="Settings"
                title="Settings"
            >
                <i class="fa-solid fa-gear"></i>
            </a>

        </nav>

    </aside>


    <!-- ==================================================
         MAIN DASHBOARD
    =================================================== -->

    <div class="main-container">

        <!-- Top navigation bar -->
        <header class="top-bar">

            <!-- Menu button -->
            <button
                type="button"
                class="menu-button"
                aria-label="Open navigation menu"
                title="Menu"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Company name -->
            <div class="brand-name">
                TimberOps
            </div>

            <!-- ==================================================
                 PROFILE MENU
            =================================================== -->

            <div class="profile-menu">

                <!-- Profile icon button -->
                <button
                    type="button"
                    id="profile-button"
                    class="profile-icon"
                    aria-label="Open profile menu"
                    aria-expanded="false"
                    title="Administrator profile"
                >
                    <i class="fa-solid fa-user"></i>
                </button>

                <!-- Dropdown menu -->
                <div
                    id="profile-dropdown"
                    class="profile-dropdown"
                >

                    <!-- Account information -->
                    <div class="profile-dropdown-heading">

                        <div class="dropdown-profile-icon">
                            <i class="fa-solid fa-user-shield"></i>
                        </div>

                        <div class="profile-details">

                            <strong>Administrator</strong>

                            <span>TimberOps account</span>

                        </div>

                    </div>

                    <!-- Logout form -->
                    <form
                        action="{{ url_for('logout') }}"
                        method="POST"
                        class="logout-form"
                    >

                        <button
                            type="submit"
                            class="logout-button"
                        >
                            <i class="fa-solid fa-right-from-bracket"></i>

                            <span>Log Out</span>
                        </button>

                    </form>

                </div>

            </div>

        </header>


        <!-- ==================================================
             PAGE CONTENT
        =================================================== -->

        <main class="content">

            <h1 class="page-title">Home</h1>

            <section class="welcome-card">

                <div class="welcome-text">

                    <h2>Welcome to TimberOps</h2>

                    <p>
                        Manage your carpentry operations quickly and efficiently.
                    </p>

                </div>

                <img
                    src="{{ url_for('static', filename='images/carpentry_img.jpg') }}"
                    alt="Carpentry tools and timber"
                    class="timber-image"
                >

            </section>

        </main>

    </div>


    <!-- ==================================================
         PROFILE MENU JAVASCRIPT
    =================================================== -->

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // Finds the profile menu elements.
            const profileMenu = document.querySelector(".profile-menu");
            const profileButton = document.getElementById("profile-button");
            const profileDropdown =
                document.getElementById("profile-dropdown");

            // Stops the script if the required elements are missing.
            if (!profileMenu || !profileButton || !profileDropdown) {
                console.error("Profile menu elements could not be found.");
                return;
            }

            // Opens or closes the dropdown.
            profileButton.addEventListener("click", function (event) {
                event.stopPropagation();

                const isOpen =
                    profileDropdown.classList.toggle("profile-dropdown-open");

                profileButton.setAttribute(
                    "aria-expanded",
                    isOpen.toString()
                );
            });

            // Prevents clicks inside the dropdown from closing it.
            profileDropdown.addEventListener("click", function (event) {
                event.stopPropagation();
            });

            // Closes the dropdown when clicking elsewhere.
            document.addEventListener("click", function () {
                profileDropdown.classList.remove(
                    "profile-dropdown-open"
                );

                profileButton.setAttribute(
                    "aria-expanded",
                    "false"
                );
            });

            // Closes the dropdown when Escape is pressed.
            document.addEventListener("keydown", function (event) {

                if (event.key === "Escape") {

                    profileDropdown.classList.remove(
                        "profile-dropdown-open"
                    );

                    profileButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    profileButton.focus();
                }

            });

        });
    </script>

</body>

</html>
